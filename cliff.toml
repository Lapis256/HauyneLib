[changelog]
header = """
# Changelog
"""

body = """
{%- macro remote_url() -%}
    https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{%- macro print_commit(commit) -%}
    - {% if commit.scope %}{{ commit.scope }}: {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | split(pat="\n") | first | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))\
{%- endmacro -%}

{% if version %}\
    ## [{{ version }}]({{ self::remote_url() }}/
    {%- if previous.version -%}\
        compare/{{ previous.version }}..{{ version }}
    {%- else -%}\
        commits/{{ version }}
    {%- endif -%}\
    ) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}

{%- for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor -%}
    {% raw %}\n{% endraw %}\
    {%- for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor %}

{%- if github and (github.contributors | filter(attribute="is_first_time", value=true) | length != 0) %}
    ### New Contributors
    {%- for contributor in github.contributors %}
        - @{{ contributor.username }} \
        {%- if contributor.pr_number %} \
            [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
        {% endif %}
    {%- endfor %}
{%- endif %}
---

"""

trim = true
render_always = true

[remote.github]
owner = "Lapis256"
repo = "HauyneLib"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
topo_order = false
commit_preprocessors = [
  { pattern = "\\(#([0-9]+)\\)", replace = "([#$1](https://github.com/anvilsaba/platform/pull/$1))" },
]
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance Improvements" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  { message = "^build", group = "<!-- 7 -->Build" },
  { message = ".*", group = "<!-- 8 -->Other Changes" },
]
skip_tags = "-(alpha|beta|rc)"
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
