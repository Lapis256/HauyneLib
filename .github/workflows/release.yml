name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - shell: bash
        run: |
          version=$(sed -n 's/^modVersion=//p' gradle.properties)
          test "${{ github.event.release.tag_name }}" = "v$version"

      - uses: ./.github/actions/setup-common-env
      - run: ./gradlew verifyRequired -PmodPublishDryRun=true
      - run: python scripts/verify_artifacts.py 26.1.2 1.21.1
  publish:
    needs: validate
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: ./.github/actions/setup-common-env

      - name: Validate all credentials before uploading
        shell: bash
        run: |
          for key in R2_ACCESS_KEY R2_SECRET_KEY R2_ENDPOINT CURSEFORGE_TOKEN MODRINTH_TOKEN; do
            test -n "${!key}" || { echo "Missing $key"; exit 1; }
          done
          ./gradlew \
            :hauyne-lib:neoforge:26.1.2:validateModRelease \
            :hauyne-lib:neoforge:1.21.1:validateModRelease \
            -PmodPublishDryRun=false

      - name: Build and publish JVM libraries
        run: |
          ./gradlew \
            :hauyne-config:core:publish \
            :hauyne-config:ksp:publish \
            :hauyne-config:nightconfig:publish \
            "-Dorg.gradle.s3.endpoint=$R2_ENDPOINT"

      - name: Publish each Minecraft version
        shell: bash
        run: |
          version=$(sed -n 's/^modVersion=//p' gradle.properties)
          for mc in 26.1.2 1.21.1; do
            ./gradlew \
              ":hauyne-lib:neoforge:$mc:build" \
              ":hauyne-config:minecraft:$mc:publish" \
              ":hauyne-config:neoforge:$mc:publish" \
              ":hauyne-lib:neoforge:$mc:publish" \
              "-Dorg.gradle.s3.endpoint=$R2_ENDPOINT"
            ./gradlew ":hauyne-lib:neoforge:$mc:publishMods" -PmodPublishDryRun=false
            series=$(echo "${mc#1.}" | cut -d. -f1,2)
            gh \
              release \
              upload \
              '${{ github.event.release.tag_name }}' \
              "hauyne-lib/neoforge/versions/$mc/build/libs/hauyne-lib-neoforge-$series-$version.jar" \
              --clobber
          done
