name: Release
run-name: Prepare release (${{ inputs.bump }})${{ inputs.dry_run && ' [dry-run]' || '' }}

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto uses Conventional Commits)
        type: choice
        default: auto
        options: [auto, major, minor, patch]
      dry_run:
        description: Check staging without publishing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4.9.1
        with:
          version: v2.14.2
          args: --version
      - uses: $/.github/actions/setup-common-env
      - name: Prepare version and notes
        env:
          BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if test "$DRY_RUN" != true; then test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"; fi
          ./gradlew prepareRelease "-PreleaseBump=$BUMP"
          cat build/release/notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check staging without external writes
        if: inputs.dry_run
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
        run: |
          ./gradlew stageRelease
          ./gradlew publishMods -PmodPublishDryRun=true --no-configuration-cache
      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          tag=$(cat build/release/tag)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties CHANGELOG.md
          git commit -m "chore(release): $tag"
          git tag -a "$tag" -m "$tag"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$tag"
      - name: Publish from the tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-release.yml --ref "$(cat build/release/tag)"
