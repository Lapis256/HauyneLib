name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup-common-env
      - name: Build, test, publish locally and simulate distribution
        run: ./gradlew ciCheck -PmodPublishDryRun=true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: results
          path: |
            **/build/reports/
            **/build/test-results/
            hauyne-lib/**/build/libs/
            hauyne-lib/**/build/publishMods/
